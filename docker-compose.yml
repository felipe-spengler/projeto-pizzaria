version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pizzaria-app
    ports:
      - "5000:80"
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      - DB_HOST=mysql
      - DB_NAME=${DB_NAME:-pizzaria}
      - DB_USER=${DB_USER:-pizzaria_user}
      - DB_PASS=${DB_PASS:-secret123}
      - DB_PASSWORD=${DB_PASSWORD:-secret123}
    depends_on:
      - mysql
    networks:
      - pizzaria-net

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-pizzaria}
      MYSQL_USER: ${DB_USER:-pizzaria_user}
      MYSQL_PASSWORD: ${DB_PASS:-secret123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pizzaria-net
    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      # URL completa onde o phpMyAdmin será acessado (subpath /db)
      PMA_ABSOLUTE_URI: https://pizzaria.techinteligente.site/db/
      # Obriga login por usuário/senha (não salva credenciais automaticamente)
      PMA_USER: ""
      PMA_PASSWORD: ""
      # Desativa login automático — usuário deve digitar user e senha
      HIDE_PHP_VERSION: "true"
      UPLOAD_LIMIT: 64M
    ports:
      - "5001:80"
    networks:
      - pizzaria-net

volumes:
  mysql_data:

networks:
  pizzaria-net:
    driver: bridge
