# Proxy reverso: /db → phpMyAdmin container
# Requer: mod_proxy mod_proxy_http mod_rewrite

# Redireciona /db para /db/ (com barra no final)
RedirectMatch ^/db$ /db/

<Location /db/>
    ProxyPass        http://phpmyadmin:80/
    ProxyPassReverse http://phpmyadmin:80/
    # Garante que os headers de host estejam corretos
    ProxyPreserveHost Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
</Location>
