version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pizzaria-app
    ports:
      - "5000:80"
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      - DB_HOST=mysql
      - DB_NAME=${DB_NAME:-pizzaria}
      - DB_USER=${DB_USER:-pizzaria_user}
      - DB_PASS=${DB_PASS:-secret123}
      - DB_PASSWORD=${DB_PASSWORD:-secret123}
    depends_on:
      - mysql
    networks:
      - pizzaria-net

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-pizzaria}
      MYSQL_USER: ${DB_USER:-pizzaria_user}
      MYSQL_PASSWORD: ${DB_PASS:-secret123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pizzaria-net
    ports:
      - "3307:3306"

volumes:
  mysql_data:

networks:
  pizzaria-net:
    driver: bridge
